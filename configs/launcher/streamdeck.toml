click_payload = { action = "Execute", power_action = "logout" }

[sd_power_standby]
click_topic = "service.power.command"
click_payload = { action = "Execute", power_action = "suspend" }

# --- Area 10: wallpaper_area ---
# Atomic wallpaper widgets — each shows a single wallpaper action

[sd_wallpaper_menu_button]
main_text = "Wallpaper"
icon = "nf-md-wallpaper"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "wallpaper_area" }

[sd_notifications_menu_button]
main_text = "Notifications"
icon = "nf-fa-bell"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "notifications_area" }

# --- Area 11: notifications_area ---
# Atomic notifications widgets — each shows a single notifications view

[notifications_area]
area_type = "scroll"
align = "center"
open_transition = "SlideLeft"
close_transition = "SlideRight"
auto_close = false
close_on_escape = true
plugins = [
    { id = "sd_notifications_close_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_notifications_count", path = "target/release/libsmearor_notifications_widget.so", widget = "notifications_count" },
    { id = "sd_notifications_latest", path = "target/release/libsmearor_notifications_widget.so", widget = "notifications_latest" },
    { id = "sd_notifications_dnd", path = "target/release/libsmearor_notifications_widget.so", widget = "notifications_dnd" },
]

[sd_notifications_close_button]
defaults = "close_button"
click_payload = { area_id = "notifications_area" }

[sd_notifications_count]
click_topic = "service.notifications.command"
click_payload = { action = "DismissLast" }
longpress_topic = "area.close"
longpress_payload = { area_id = "notifications_area" }

[sd_notifications_latest]
click_topic = "service.notifications.command"
click_payload = { action = "DismissLast" }
longpress_topic = "service.notifications.command"
longpress_payload = { action = "DismissAll" }

[sd_notifications_dnd]
click_topic = "service.notifications.command"
click_payload = { action = "ToggleDoNotDisturb" }

