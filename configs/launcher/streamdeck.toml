# MacroPad launcher config for Stream Deck Original V2
# Device: Elgato Stream Deck original V2 (0fd9:006d)
# Serial: AL41K2C57100
# 15 keys (5x3), 72x72 px per key

areas = ["main_menu"]

# Per-workspace layout profiles
[[profiles]]
trigger = { Workspace = 2 }
areas = ["development_menu"]

[defaults.close_button]
main_text = ""
info_text = "Zurück"
icon = "nf-md-undo"
icon_color = "#dc0073ff"
click_topic = "area.close"
enabled = true
active = false
css_classes = ["close-button"]

[launcher]
rotation = 0
layer = "top"
namespace = "smearor-swipe-launcher"

[layout]
orientation = "horizontal"
spacing = 0

# --- Area 1: Hauptmenü ---
# 15 keys: first 2 buttons navigate to sub-areas, rest blank/placeholder

[main_menu]
area_type = "fixed"
width = 360
plugins = [
    { id = "workspace_switcher", path = "target/release/libsmearor_workspace_switcher.so", widget = "workspace_switcher" },
    { id = "sd_light_office_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_light_livingroom_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_light_bedroom_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_weather_widget", path = "target/release/libsmearor_weather_widget.so", widget = "weather" },
    { id = "sd_audio_widget", path = "target/release/libsmearor_audio_widget.so", widget = "audio" },
    { id = "sd_mpris_widget", path = "target/release/libsmearor_mpris_widget.so", widget = "mpris" },
    { id = "sd_clock_widget", path = "target/release/libsmearor_clock_widget.so", widget = "clock" },
    { id = "sd_games_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_sysinfo_menu_button", path = "target/release/libsmearor_sysinfo_widget.so", widget = "sysinfo" },
    { id = "sd_network_menu_button", path = "target/release/libsmearor_network_widget.so", widget = "network" },
    { id = "sd_power_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_wallpaper_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_notifications_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_voice_assistant_menu_button", path = "target/release/libsmearor_button_widget.so" },
]

# Plugins in the center scroll band
[development_menu]
area_type = "fixed"
width = 360
plugins = [
    { id = "workspace_switcher", path = "target/release/libsmearor_workspace_switcher.so", widget = "workspace_switcher" },
    { id = "sd_sysinfo_menu_button", path = "target/release/libsmearor_sysinfo_widget.so", widget = "sysinfo" },
]

[sd_light_office_button]
main_text = "Licht Büro"
icon = "nf-md-monitor"
icon_color = "#dc0073ff"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "office_area" }

[sd_light_livingroom_button]
main_text = "Licht Wohnzimmer"
icon = "nf-md-sofa"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "livingroom_area" }

[sd_light_bedroom_button]
main_text = "Licht Schlafzimmer"
icon = "nf-md-bed"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "bedroom_area" }

[sd_weather_widget]
width = 72
height = 72
views = ["Current", "ForecastToday", "ForecastTomorrow", "Wind", "Humidity", "Sunrise", "Sunset", "AirPollution", "Pressure", "UvIndex", "CloudCover", "Sunshine", "PrecipitationProbability", "PrecipitationAmount", "Precipitation"]
longpress_topic = "area.open"
longpress_payload = { area_id = "weather_area" }

[sd_audio_widget]
width = 72
height = 72
longpress_topic = "area.open"
longpress_payload = { area_id = "audio_area" }

[sd_mpris_widget]
width = 72
height = 72
longpress_topic = "area.open"
longpress_payload = { area_id = "mpris_area" }

[sd_clock_widget]
width = 72
height = 72
mode = "compact"
click_topic = "area.open"
click_payload = { area_id = "clock_area" }

# --- Area 2: office_area ---
# Reuses the same Shelly light buttons from the main config

[office_area]
area_type = "scroll"
align = "center"
open_transition = "SlideLeft"
close_transition = "SlideRight"
auto_close = false
close_on_escape = true
plugins = [
    { id = "sd_office_close_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "sd_office_desk_light", path = "target/release/libsmearor_button_widget.so" },
