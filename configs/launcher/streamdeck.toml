click_payload = { area_id = "office_area" }

[sd_office_desk_light]
main_text = "Desk"
icon = "nf-md-lamp"
icon_only = false
click_topic = "service.http.request"
click_payload = { method = "Get", url = "http://192.168.178.64/relay/0?turn=on", response_topic = "service.http.response.shelly.office.desk.light.sd" }
