state_css_class = "light-active"

[scx_office_kommode_light]
main_text = "Kommode"
icon = "nf-md-led_strip"
icon_only = false
click_topic = "service.http.request"
click_payload = { method = "Get", url = "http://192.168.178.31/color/0?turn=on&red=255&green=0&blue=0&gain=100", response_topic = "service.http.response.shelly.office.kommode.light.scx" }
