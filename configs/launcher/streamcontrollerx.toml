# MacroPad launcher config for Razer Stream Controller X
# Device: Razer Stream Controller X (1532:0d09)
# 15 keys (5x3), 96x96 px per key
# Discovered via serial port by the loupedeck service (loupedeck-driver crate)

areas = ["main_menu"]

[launcher]
instance_type = "headless"

[layout]
orientation = "horizontal"
spacing = 0

# --- Area 1: Hauptmenü ---
# 15 keys: first 2 buttons navigate to sub-areas, rest blank/placeholder

[main_menu]
area_type = "fixed"
width = 360
#width = 480
plugins = [
    { id = "scx_light_office_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_light_livingroom_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_light_bedroom_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_weather_widget", path = "target/release/libsmearor_weather_widget.so", widget = "weather" },
    { id = "scx_audio_widget", path = "target/release/libsmearor_audio_widget.so", widget = "audio" },
    { id = "scx_mpris_widget", path = "target/release/libsmearor_mpris_widget.so", widget = "mpris" },
    { id = "scx_clock_widget", path = "target/release/libsmearor_clock_widget.so", widget = "clock" },
    { id = "scx_sysinfo_menu_button", path = "target/release/libsmearor_sysinfo_widget.so", widget = "sysinfo" },
    { id = "scx_network_menu_button", path = "target/release/libsmearor_network_widget.so", widget = "network" },
    { id = "scx_power_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_wallpaper_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_notifications_menu_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_voice_assistant_menu_button", path = "target/release/libsmearor_button_widget.so" },
]

[scx_light_office_button]
main_text = "Licht Büro"
icon = "nf-md-monitor"
icon_color = "#dc0073ff"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "office_area" }

[scx_light_livingroom_button]
main_text = "Licht Wohnzimmer"
icon = "nf-md-sofa"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "livingroom_area" }

[scx_light_bedroom_button]
main_text = "Licht Schlafzimmer"
icon = "nf-md-bed"
icon_only = false
click_topic = "area.open"
click_payload = { area_id = "bedroom_area" }

[scx_weather_widget]
width = 72
height = 72
views = ["Current", "ForecastToday", "ForecastTomorrow", "Wind", "Humidity", "Sunrise", "Sunset", "AirPollution", "Pressure", "UvIndex", "CloudCover", "Sunshine", "PrecipitationProbability", "PrecipitationAmount", "Precipitation"]
longpress_topic = "area.open"
longpress_payload = { area_id = "weather_area" }

[scx_audio_widget]
width = 72
height = 72
longpress_topic = "area.open"
longpress_payload = { area_id = "audio_area" }

[scx_mpris_widget]
width = 72
height = 72
longpress_topic = "area.open"
longpress_payload = { area_id = "mpris_area" }

[scx_clock_widget]
width = 72
height = 72
mode = "compact"
click_topic = "area.open"
click_payload = { area_id = "clock_area" }

# --- Area 2: office_area ---
# Reuses the same Shelly light buttons from the main config

[office_area]
area_type = "scroll"
align = "center"
open_transition = "SlideLeft"
close_transition = "SlideRight"
auto_close = false
close_on_escape = true
plugins = [
    { id = "scx_office_close_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_office_desk_light", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_office_window_light", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_office_kommode_light", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_office_floor_light", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_office_fan", path = "target/release/libsmearor_button_widget.so" },
]

[scx_office_close_button]
main_text = "Zurück"
icon = "nf-md-undo"
icon_only = true
click_topic = "area.close"
click_payload = { area_id = "office_area" }

[scx_office_desk_light]
main_text = "Desk"
icon = "nf-md-lamp"
icon_only = false
click_topic = "service.http.request"
click_payload = { method = "Get", url = "http://192.168.178.64/relay/0?turn=on", response_topic = "service.http.response.shelly.office.desk.light.scx" }
longpress_topic = "service.http.request"
longpress_payload = { method = "Get", url = "http://192.168.178.64/relay/0?turn=off", response_topic = "service.http.response.shelly.office.desk.light.scx" }
state_topic = "service.http.response.shelly.office.desk.light.scx"
init_topic = "service.http.request"
init_payload = { method = "Get", url = "http://192.168.178.64/relay/0", response_topic = "service.http.response.shelly.office.desk.light.scx" }
state_icon = "{ison?nf-md-lamp:nf-md-lamp_outline}"
state_css_class = "light-active"

[scx_office_window_light]
main_text = "Window"
icon = "nf-md-ceiling_light_multiple"
icon_only = false
click_topic = "service.http.request"
