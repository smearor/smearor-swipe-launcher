plugins = [
    { id = "scx_wallpaper_close_button", path = "target/release/libsmearor_button_widget.so" },
    { id = "scx_wallpaper_current", path = "target/release/libsmearor_wallpaper_widget.so", widget = "wallpaper_current" },
    { id = "scx_wallpaper_selector", path = "target/release/libsmearor_wallpaper_widget.so", widget = "wallpaper_selector" },
    { id = "scx_wallpaper_next", path = "target/release/libsmearor_wallpaper_widget.so", widget = "wallpaper_next" },
    { id = "scx_wallpaper_previous", path = "target/release/libsmearor_wallpaper_widget.so", widget = "wallpaper_previous" },
    { id = "scx_wallpaper_random", path = "target/release/libsmearor_wallpaper_widget.so", widget = "wallpaper_random" },
]

[scx_wallpaper_close_button]
main_text = "Zurück"
icon = "nf-md-undo"
icon_only = true
click_topic = "area.close"
click_payload = { area_id = "wallpaper_area" }

[scx_wallpaper_current]
render_mode = "graphic_only"
click_topic = "service.wallpaper.command"
click_payload = { action = "StartSelected" }
longpress_topic = "area.close"
longpress_payload = { area_id = "wallpaper_area" }

[scx_wallpaper_selector]
click_topic = "service.wallpaper.command"
click_payload = { action = "StartSelected" }
longpress_topic = "area.close"
longpress_payload = { area_id = "wallpaper_area" }

[scx_wallpaper_next]
click_topic = "service.wallpaper.command"
click_payload = { action = "StartSelected" }

[scx_wallpaper_previous]
click_topic = "service.wallpaper.command"
click_payload = { action = "StartSelected" }

[scx_wallpaper_random]
click_topic = "service.wallpaper.command"
click_payload = { action = "StartSelected" }
