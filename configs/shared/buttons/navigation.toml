# Shared cross-instance navigation buttons.
# These buttons open areas in OTHER launcher instances.
# Each instance overrides its own local button (without click_instance)
# in its main config file, which replaces the cross-instance version here.

[open_top_area_button]
defaults = "menu_button"
text = "Open Example 2 Area"
icon = "panel-top-symbolic"
icon_only = true
click_instance = "top"
click_payload = { area_id = "top_area" }
longpress_instance = "top"
longpress_payload = { area_id = "top_area" }
css_classes = ["menu-button", "primary"]

