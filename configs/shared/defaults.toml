# Shared default templates for plugin configs.
# Individual plugins reference a template with: defaults = "template_name"
# Instance-specific values always override the template values.
#
# Text color configuration (optional, supported by all widgets):
#   main_text_color = "#RRGGBBAA"  - Color for the primary text line
#   info_text_color = "#RRGGBBAA"  - Color for the secondary/info text line
# Both accept hex color strings (e.g. "#ff6600", "#f60", "#ff660080").
# If omitted, the default text color from the theme is used.

[defaults.menu_button]
click_topic = "area.open"
longpress_topic = "area.close"
enabled = true
active = false
css_classes = ["menu-button", "glow-blue"]

[defaults.close_button]
main_text = ""
info_text = "Zurück"
icon = "nf-md-undo"
icon_color = "#dc0073ff"
click_topic = "area.close"
enabled = true
active = false
css_classes = ["close-button"]

[defaults.app_launcher]
