# Shared background services for all launcher instances
# Loaded once by LauncherHost and shared across all windows

[mcp]
# Address to bind the MCP server to.
# Use "127.0.0.1" (default) for localhost-only access.
# Use "0.0.0.0" to allow access from other machines on the network.
#bind_address = "127.0.0.1"
bind_address = "0.0.0.0"
port = 8765
# Optional bearer token for authentication.
# auth_token = "my-secret-token"

# Embedded web server for browser-based launcher instances.
# Access via http://127.0.0.1:8080/instances/{id}
[web]
enabled = true
# Address to bind to. Use "127.0.0.1" (default) for localhost-only access.
# Use "0.0.0.0" to allow access from other machines on the network.
#bind_address = "127.0.0.1"
bind_address = "0.0.0.0"
port = 8080
# Optional bearer token required for all HTTP and WebSocket requests.
# If set, clients must send Authorization: Bearer <token> or ?token=<token>.
# auth_token = "my-web-secret"
# Allowed CORS origins. If empty, defaults to localhost only.
# Use ["*"] to allow all origins (not recommended for production).
# allowed_origins = ["http://localhost:8080", "http://127.0.0.1:8080"]

[[services]]
id = "app_launcher"
path = "target/release/libsmearor_app_launcher_service.so"

[[services]]
id = "audio"
path = "target/release/libsmearor_audio_service.so"

[[services]]
id = "mpris"
path = "target/release/libsmearor_mpris_service.so"

[[services]]
id = "notifications"
path = "target/release/libsmearor_notifications_service.so"

[[services]]
id = "hyprland"
path = "target/release/libsmearor_hyprland_service.so"

[[services]]
id = "sysinfo"
path = "target/release/libsmearor_sysinfo_service.so"
cpu_temperature_source = "hwmon"

[[services]]
id = "http"
path = "target/release/libsmearor_http_service.so"

[[services]]
id = "weather"
path = "target/release/libsmearor_weather_service.so"

[[services]]
id = "power"
path = "target/release/libsmearor_power_service.so"

[[services]]
id = "network"
path = "target/release/libsmearor_network_service.so"

[[services]]
id = "wayland"
path = "target/release/libsmearor_wayland_service.so"

[[services]]
id = "gnome"
path = "target/release/libsmearor_gnome_service.so"

[[services]]
id = "terminal_command"
path = "target/release/libsmearor_terminal_command_service.so"

[[services]]
id = "wallpaper"
path = "target/release/libsmearor_wallpaper_service.so"

[[services]]
id = "streamdeck"
path = "target/release/libsmearor_streamdeck_service.so"

[[services]]
id = "streamcontrollerx"
path = "target/release/libsmearor_loupedeck_service.so"

[[services]]
id = "personalization"
path = "target/release/libsmearor_personalization_service.so"

#[[services]]
#id = "voice_assistant"
#path = "target/release/libsmearor_voice_assistant_service.so"

[[services]]
id = "doa"
path = "target/release/libsmearor_doa_service.so"

[http]
allowed_urls = ["192.168.178.*", "https://api.open-meteo.com/*", "https://api.sunrise-sunset.org/*"]
default_timeout_ms = 10000
max_response_bytes = 1048576

# Service-specific configurations
[app_launcher]
smearor_wrot_path = "smearor-wrot"
rotation = 0

[sysinfo]
update_interval_ms = 5000
enable_cpu_temperature = true
# Supported sources: "thermal_zone" (default), "hwmon", or an absolute path like
# "/sys/class/hwmon/hwmon0/temp1_input".
# cpu_temperature_source = "hwmon"
enable_battery = true
enable_disks = true
enable_network = true
# selects which component is the primary cpu_temperature
cpu_temperature_component = "Tctl"

[weather]
latitude = 47.55
longitude = 9.70
update_interval_minutes = 30
enable_air_quality = true
timezone = "auto"
forecast_days = 2

[power]
countdown_seconds = 10
enable_inhibitor_detection = true
enable_scheduled_actions = true
mcp_enabled = false
refresh_interval_seconds = 30
# Hyprland:
#lock_command = "hyprlock"
#logout_command = "hyprctl dispatch exit"
# GNOME
lock_command = ""
logout_command = ""

[network]
refresh_interval_seconds = 5
enable_wifi_scan = true
enable_vpn_management = true
enable_throughput_monitoring = true
throughput_sample_interval_seconds = 2
public_ip_url = "https://api.ipify.org?format=json"

[wallpaper]
default_theme = "Smearor"
auto_start = false
# config_path is optional. If omitted, the launcher resolves wallpaper.toml via:
# working dir > ~/.config/smearor/services/wallpaper.toml > /usr/share/smearor/services/wallpaper.toml
#config_path = "configs/services/wallpaper.toml"
kill_grace_period_ms = 3000

[wayland]
enable_workspace_tracking = true

[gnome]
enable_workspace_tracking = true
poll_interval_ms = 500

[terminal_command.commands.btop]
command = "smearor-wrot"
args = [
    "--auto-color-mask",
    "--background-color",
    "#f5b70033",
    "--decorated",
    "alacritty",
    "--command",
    "btop"
]
env = { }

[terminal_command.commands.yazi]
command = "smearor-wrot"
args = [
    "--auto-color-mask",
    "--background-color",
    "#04e76233",
    "--decorated",
    "alacritty",
    "--command",
    "yazi"
]
env = { }

[streamdeck]
brightness = 100
poll_interval_ms = 50
auto_dimming_enabled = true
auto_dim_timeout_ms = 60000
auto_dim_brightness = 15
auto_dim_fade_step_ms = 50
auto_dim_fade_step_percent = 2
auto_dim_fade_up_step_percent = 10

[streamcontrollerx]
brightness = 100
poll_interval_ms = 50
auto_dimming_enabled = true
auto_dim_timeout_ms = 60000
auto_dim_brightness = 15
auto_dim_fade_step_ms = 50
auto_dim_fade_step_percent = 10
auto_dim_fade_up_step_percent = 25

[personalization]
#latitude = 47.55
#longitude = 9.70
#locale = "de-DE"
locale = "de-DE"
timezone = "Europe/Berlin"
enable_location = true
update_interval_seconds = 300
# Re-query location every 30 minutes (min 300)
location_update_interval_seconds = 1800
# Skip update if coords change < ~1.1 km
location_change_threshold = 0.01

[voice_assistant]
#whisper_model_path = "~/.local/share/smearor/models/ggml-tiny.bin"
#whisper_model_path = "~/.local/share/smearor/models/ggml-base.bin"
#whisper_model_path = "~/.local/share/smearor/models/ggml-small.bin"
whisper_model_path = "~/.local/share/smearor/models/ggml-large-v3-turbo-q5_0.bin"
# HuggingFace repo for auto-download (empty = hardcoded fallback mapping)
#whisper_model_repo = "openai/whisper-large-v3-turbo"
llm_model_path = "~/.local/share/smearor/models/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf"
#llm_model_path = "~/.local/share/smearor/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
#llm_model_path = "~/.local/share/smearor/models/qwen2.5-3b-instruct-q4_k_m.gguf"
# HuggingFace repo for auto-download (empty = hardcoded fallback mapping)
#llm_model_repo = "unsloth/gemma-4-E4B-it-GGUF"
llm_threads = 4
#llm_context_size = 4096
llm_context_size = 8192
llm_batch_size = 512
llm_max_tokens = 2048
max_catalog_chars = 8000
max_react_iterations = 8
llm_temperature = 0.1
audio_sample_rate = 16000
audio_channels = 1
max_recording_seconds = 30
silence_threshold_seconds = 1.5
language = "de"
#language = "en"
auto_enable = false
# system_prompt removed — using built-in default which includes ReAct loop prevention

# Session management: context shifting configuration
# When the KV cache approaches the context limit, oldest tokens are shifted out
# instead of resetting the entire session. This preserves recent context and
# avoids expensive re-evaluation of all tokens.
# Maximum tokens before context shifting is triggered (default: 4096)
#max_context_tokens = 4096
# Ratio of tokens to keep when shifting (0.0–1.0, default: 0.8 = keep 80%)
#context_keep_ratio = 0.8
# Minimum tokens to preserve during shifting, e.g. system prompt (default: 512)
#min_preserve_tokens = 512

# GBNF grammar enforcement constrains LLM output to valid ReAct JSON.
# Disable if the GPU backend (Vulkan) crashes with grammar samplers.
use_grammar = false

# Embedding model for semantic memory (fastembed).
# BGEM3 is multilingual (100+ languages, 8192 context, 1024-dim).
embedding_model = "BGEM3"

# Minimum cosine similarity for semantic tool/resource/prompt selection.
# Tools below this threshold are excluded from the LLM prompt.
# Lower = more tools included, higher = stricter selection.
tool_selection_threshold = 0.3

# Silero VAD (Voice Activity Detection) post-processing.
# Trims leading/trailing non-speech from captured audio before Whisper
# transcription, reducing hallucinations from background noise.
# Download silero_vad.onnx from https://github.com/snakers4/silero-vad
vad_enabled = true
vad_model_path = "~/.local/share/smearor/models/silero_vad.onnx"
# HuggingFace repo for auto-download (empty = hardcoded fallback mapping)
#vad_model_repo = "snakers4/silero-vad"
# Speech probability threshold (0.0–1.0). Frames below this are non-speech.
vad_threshold = 0.5

# TTS (Text-to-Speech) configuration
# Download a Piper model from https://github.com/rhasspy/piper/releases
# Required files: .onnx model + .onnx.json config
[voice_assistant.tts]
enabled = true
tts_enabled_mcp = true
#model_path = "~/.local/share/smearor/models/de_DE-thorsten-medium.onnx"
model_path = "~/.local/share/smearor/models/de_DE-thorsten-high.onnx"
# HuggingFace repo for auto-download (empty = hardcoded fallback mapping)
#model_repo = "rhasspy/piper-voices"
#config_path = "~/.local/share/smearor/models/de_DE-thorsten-medium.onnx.json"
config_path = "~/.local/share/smearor/models/de_DE-thorsten-high.onnx.json"
model_type = "Piper"
model_sample_rate = 22050
voice = ""
# conversion_step = false -> use specialized text-processing-rs to convert text to IPA
# conversion_step = true -> LLM converts text to IPA
conversion_step = false
phonemize_enabled = true
disable_pad_id = false

[voice_assistant.tts.phonemizer_config]
language = "de"

[voice_assistant.wake_word]
auto_enable = true
model = "Alexa"
# model = "HeyMycroft"
threshold = 0.1

[voice_assistant.doa_vad]
enabled = false
grace_period_ms = 400
min_speech_duration_ms = 100
skip_wake_word_on_vad = true
aec_mirroring_enabled = false
tts_mute_holdover_ms = 300

[audio.ducking]
enabled = false
ducking_volume = 0.2
ducking_grace_period_ms = 500
min_speech_duration_ms = 100
fade_ramp_ms = 500
duck_notification_sounds = false
duck_during_tts = true

[doa]
poll_interval_ms = 150
mcp_enabled = true
reconnect_delay_ms = 2000
rotation_offset = 0
# product_id = 0x0021
