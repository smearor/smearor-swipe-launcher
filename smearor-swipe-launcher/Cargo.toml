[package]
name = "smearor-swipe-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-channel = { workspace = true }
axum = { workspace = true }
dashmap = { workspace = true }
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
libloading = { workspace = true }
miette = { workspace = true }
nerd_gtk_icons = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-mcp-server = { path = "../mcp-server" }
smearor-model-area = { path = "../model/area" }
smearor-model-mcp = { path = "../model/mcp" }
smearor-model-plugin = { path = "../model/plugin" }
smearor-model-compositor = { path = "../model/workspace" }
smearor-model-instance-control = { path = "../model/instance-control" }
smearor-model-macropad = { path = "../model/macropad" }
smearor-model-widget = { path = "../model/widget" }
smearor-swipe-launcher-plugin-api = { path = "../plugin-api" }
smearor-wrot-rotation = { workspace = true }
stabby = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-log = "0.2"
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[build-dependencies]
glib-build-tools = { workspace = true }

[package.metadata.deb]
name = "smearor-swipe-launcher"
maintainer = "Andreas Schaeffer"
extended-description = "Smearor Swipe Launcher — a GTK4 layer-shell launcher for Wayland compositors"
depends = "$auto, libgtk4-layer-shell0"
maintainer-scripts = "debian"
assets = [
    ["target/release/smearor-swipe-launcher", "/usr/bin/", "755"],
    ["../resources/systemd/smearor-swipe-launcher.service", "/usr/lib/systemd/user/", "644"],
    ["../resources/systemd/smearor-swipe-launcher-hyprland.service", "/usr/lib/systemd/user/", "644"],
    ["../resources/systemd/smearor-swipe-launcher-gnome.service", "/usr/lib/systemd/user/", "644"],
    ["../configs/system/launcher/config.toml", "/usr/share/smearor/launcher/config.toml", "644"],
    ["../configs/system/services/services.toml", "/usr/share/smearor/services/services.toml", "644"],
    ["../configs/system/services/wallpaper.toml", "/usr/share/smearor/services/wallpaper.toml", "644"],
    ["../configs/launcher/config.toml", "/usr/share/smearor/examples/launcher/config.toml", "644"],
    ["../configs/launcher/example-bottom.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/example-left.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/example-right.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/example-top.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/layout_profiles.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/minimal.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/rotated-90.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/streamdeck.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/streamcontrollerx.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/launcher/web.toml", "/usr/share/smearor/examples/launcher/", "644"],
    ["../configs/areas/scroll_menu.toml", "/usr/share/smearor/examples/areas/", "644"],
    ["../resources/NerdFontsSymbolsOnly/SymbolsNerdFont-Regular.ttf", "/usr/share/smearor/resources/NerdFontsSymbolsOnly/", "644"],
    ["../resources/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf", "/usr/share/smearor/resources/NerdFontsSymbolsOnly/", "644"],
    ["../resources/JetBrainsMonoNLNerdFont/JetBrainsMonoNLNerdFont-Regular.woff2", "/usr/share/smearor/resources/JetBrainsMonoNLNerdFont/", "644"],
    ["../resources/JetBrainsMonoNLNerdFont/JetBrainsMonoNLNerdFont-Bold.woff2", "/usr/share/smearor/resources/JetBrainsMonoNLNerdFont/", "644"],
    ["../resources/JetBrainsMonoNLNerdFont/JetBrainsMonoNLNerdFont-Thin.woff2", "/usr/share/smearor/resources/JetBrainsMonoNLNerdFont/", "644"],
]
