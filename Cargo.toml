[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Andreas Schaeffer"]

[workspace.dependencies]
stabby = { version = "72.1", features = ["libloading"] }
axum = { version = "0.8", features = ["tokio", "ws"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
async-stream = "0.3"
adw = { package = "libadwaita", version = "0.9.1" }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.1"
encoding_rs = "0.8"
# llama-cpp-4 = { version = "0.4.2" }
llama-cpp-4 = { version = "0.5.1" }
whisper-rs = { version = "0.16" }
async-channel = "2.5"
dashmap = "6.2.1"
dirs = "6.0"
freedesktop_entry_parser = "2.0"
futures-util = "0.3"
gtk4 = "0.11"
shellexpand = "3.1"
glib = "0.22"
glib-build-tools = "0.22"
gio = "0.22"
gtk4-layer-shell = "0.8"
hf-hub = "0.5"
#hyprland = "0.3.13"
hyprland = { git = "https://github.com/aschaeffer/hyprland-rs", branch = "master" }
libpulse-binding = "2.30"
libloading = "0.9"
miette = { version = "7.4", features = ["fancy"] }
nerd_gtk_icons = "0.1.1"
paste = "1.0"
regex = "1"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
gguf = "0.1"
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = ["component"] }
text-processing-rs = { git = "https://github.com/FluidInference/text-processing-rs.git" }
smearor-wrot-rotation = { version = "0.2.0" }
#smearor-wrot-rotation = { version = "0.1", path = "../smearor-wrot-rotation" }
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4"] }
typed-builder = "0.23.2"
nucleo-matcher = "0.3"
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync", "future"] }
notify = "8"
fastembed = "5.17"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12" } # , default-features = true, features = ["load-dynamic"]
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
which = "8.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
zbus = "5"
espeak-ng = { version = "0.1.3", features = ["bundled-data-de", "bundled-data-en"] }
unicode-normalization = "0.1"
oww-rs = "0.3"
ringbuf = "0.4"
ab_glyph = "0.2"
imageproc = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.44"
usvg = "0.44"
strum = "0.28"
strum_macros = "0.28"
loupedeck-driver = { git = "https://github.com/aschaeffer/loupedeck-rs.git" }
reqwest = { version = "0.13", features = ["json"] }
ashpd = { version = "0.13", default-features = false, features = ["location", "settings", "tokio"] }
iana-time-zone = "0.1"
sys-locale = "0.3"
