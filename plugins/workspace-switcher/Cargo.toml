[package]
name = "smearor-workspace-switcher"
version = "0.1.0"
description = "Workspace switcher widget plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stabby = { workspace = true }
glib = { workspace = true }
gtk4 = { workspace = true }
miette = { workspace = true }
paste = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-compositor = { path = "../../model/workspace" }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-model-widget = { path = "../../model/widget" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-render-utils = { path = "../render-utils" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typed-builder = { workspace = true }

[package.metadata.deb]
name = "smearor-plugin-workspace-switcher"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0), smearor-service-hyprland (>= 0.1.0) | smearor-service-gnome (>= 0.1.0) | smearor-service-wayland (>= 0.1.0), smearor-service-personalization (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_workspace_switcher.so", "/usr/lib/smearor/", "644"],
]
