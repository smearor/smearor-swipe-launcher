[package]
name = "smearor-theme-widget"
version = "0.1.0"
description = "Theme switcher widget plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
glib = { workspace = true }
gtk4 = { workspace = true, features = ["unsafe-assume-initialized"] }
paste = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-model-widget = { path = "../../model/widget" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-render-utils = { path = "../render-utils" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
smearor-theme-model = { path = "../../model/theme" }
stabby = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typed-builder = { workspace = true }

[package.metadata.deb]
name = "smearor-plugin-theme"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0), smearor-service-theme (>= 0.1.0), smearor-service-personalization (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_theme_widget.so", "/usr/lib/smearor/", "644"],
]
