[package]
name = "smearor-notifications-widget"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
adw = { workspace = true }
glib = { workspace = true }
gtk4 = { workspace = true, features = ["unsafe-assume-initialized"] }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-model-widget = { path = "../../model/widget" }
smearor-notifications-model = { path = "../../model/notifications" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-render-utils = { path = "../render-utils" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
stabby = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
