[package]
name = "smearor-app-launcher-widget"
version = "0.1.0"
description = "App launcher widget plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stabby = { workspace = true }
adw = { workspace = true }
freedesktop_entry_parser = { workspace = true }
gtk4 = { workspace = true, features = ["unsafe-assume-initialized"] }
glib = { workspace = true }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-app-launcher-model = { path = "../../model/app-launcher" }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-render-utils = { path = "../render-utils" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
name = "smearor-plugin-app-launcher"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0), smearor-service-app-launcher (>= 0.1.0), smearor-service-personalization (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_app_launcher_widget.so", "/usr/lib/smearor/", "644"],
]
