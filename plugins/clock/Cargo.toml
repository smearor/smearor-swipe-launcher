[package]
name = "smearor-clock-widget"
version = "0.1.0"
description = "Clock widget plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stabby = { workspace = true }
adw = { workspace = true }
glib = { workspace = true }
gtk4 = { workspace = true, features = ["unsafe-assume-initialized"] }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-model-widget = { path = "../../model/widget" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-render-utils = { path = "../render-utils" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
smearor-clock-model = { path = "../../model/clock" }
thiserror = { workspace = true }
time = { version = "0.3", features = ["local-offset", "formatting"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typed-builder = { workspace = true }

[package.metadata.deb]
name = "smearor-plugin-clock"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0), smearor-service-personalization (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_clock_widget.so", "/usr/lib/smearor/", "644"],
]
