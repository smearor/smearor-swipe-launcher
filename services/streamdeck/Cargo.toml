[package]
name = "smearor-streamdeck-service"
version = "0.1.0"
description = "Stream Deck MacroPad service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
elgato-streamdeck = "0.13"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
stabby = { workspace = true }
glib = { workspace = true }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-macropad = { path = "../../model/macropad" }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
name = "smearor-service-streamdeck"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0)"
assets = [
    ["../../target/release/libsmearor_streamdeck_service.so", "/usr/lib/smearor/", "644"],
    ["../../resources/udev/52-streamdeck.rules", "/usr/lib/udev/rules.d/", "644"],
]
