[package]
name = "smearor-hyprland-service"
version = "0.1.0"
description = "Hyprland compositor service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hyprland = { workspace = true }
paste = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stabby = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smearor-hyprland-model = { path = "../../model/hyprland" }
smearor-hyprland-shared = { path = "../../model/hyprland-shared" }
smearor-hyprland-dispatch = { path = "../../model/hyprland-dispatch" }
smearor-hyprland-status = { path = "../../model/hyprland-status" }
smearor-hyprland-command = { path = "../../model/hyprland-command" }
smearor-model-compositor = { path = "../../model/workspace" }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }

[package.metadata.deb]
name = "smearor-service-hyprland"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_hyprland_service.so", "/usr/lib/smearor/", "644"],
]
