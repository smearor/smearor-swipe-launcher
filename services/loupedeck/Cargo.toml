[package]
name = "smearor-loupedeck-service"
version = "0.1.0"
description = "Loupedeck MacroPad service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
loupedeck-driver = { workspace = true }
image = { workspace = true, default-features = false, features = ["png"] }
stabby = { workspace = true }
glib = { workspace = true }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-macropad = { path = "../../model/macropad" }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
name = "smearor-service-loupedeck"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0)"
maintainer-scripts = "debian"
assets = [
    ["target/release/libsmearor_loupedeck_service.so", "/usr/lib/smearor/", "644"],
    ["../../resources/udev/52-loupedeck.rules", "/usr/lib/udev/rules.d/", "644"],
]
