[package]
name = "smearor-weather-service"
version = "0.1.0"
description = "Weather service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
openmeteo-rs = "1"
reqwest = { workspace = true, features = ["json", "query"] }
stabby = { workspace = true }
glib = { workspace = true }
miette = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-mcp = { path = "../../model/mcp" }
smearor-personalization-model = { path = "../../model/personalization" }
smearor-weather-model = { path = "../../model/weather" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
name = "smearor-service-weather"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0), smearor-service-personalization (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_weather_service.so", "/usr/lib/smearor/", "644"],
]
