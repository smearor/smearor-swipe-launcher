[package]
name = "smearor-terminal-command-service"
version = "0.1.0"
description = "Terminal command service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
dashmap = { workspace = true }
glib = { workspace = true }
nix = { version = "0.29", features = ["signal"] }
paste = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
smearor-terminal-command-model = { path = "../../model/terminal_command" }
smearor-model-mcp = { path = "../../model/mcp" }
stabby = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
which = { workspace = true }

[package.metadata.deb]
name = "smearor-service-terminal-command"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_terminal_command_service.so", "/usr/lib/smearor/", "644"],
]
