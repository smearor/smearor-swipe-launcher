[package]
name = "smearor-sysinfo-service"
version = "0.1.0"
description = "System info service plugin for the Smearor Swipe Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stabby = { workspace = true }
glib = { workspace = true }
miette = { workspace = true }
nix = { version = "0.29", features = ["fs"] }
paste = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smearor-model-mcp = { path = "../../model/mcp" }
sysinfo = { workspace = true }
smearor-sysinfo-model = { path = "../../model/sysinfo" }
smearor-swipe-launcher-plugin-api = { path = "../../plugin-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
name = "smearor-service-sysinfo"
depends = "$auto, smearor-swipe-launcher (>= 0.1.0)"
assets = [
    ["target/release/libsmearor_sysinfo_service.so", "/usr/lib/smearor/", "644"],
]
